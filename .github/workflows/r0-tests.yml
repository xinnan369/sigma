name: R0 utility tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-r0.txt
      - run: python -m pip install -r requirements-r0.txt
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests
      - run: python experiments/exp0/env_check.py
